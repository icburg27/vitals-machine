name: daily-harvest
on:
  schedule:
    - cron: '0 12 * * 2-6'   # Tue-Sat 12:00 UTC (prior trading day's file)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas numpy pyyaml yfinance
      - run: python src/harvest.py
      - name: commit
        run: |
          git config user.name "vitals-machine"
          git config user.email "machine@users.noreply.github.com"
          git add data/ && git diff --cached --quiet || git commit -m "harvest $(date -u +%F)"
          git push
